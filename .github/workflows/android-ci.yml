name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local secrets file with safe empty defaults
        run: |
          printf '%s\n' '# Provider API keys are server-side only.' > .env
      - name: Require and verify Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON repository secret is required; refusing to build an unconfigured APK."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq -e --arg project "gen-lang-client-0435606672" --arg package "com.aistudio.novaforge.kxmpzq" '
            .project_info.project_id == $project and
            any(.client[]; .client_info.android_client_info.package_name == $package)
          ' app/google-services.json > /dev/null
          echo "Verified Firebase project and Android package configuration."

      - name: Generate and verify Firebase Android resources
        run: |
          set -euo pipefail
          gradle --no-daemon :app:processDebugGoogleServices
          generated="app/build/generated/res/google-services/debug/values/values.xml"
          test -s "$generated"
          grep -q 'name="default_web_client_id"' "$generated"
          echo "Firebase Google Services resources generated and verified."

      - name: Set up Node.js for Firebase emulators
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install Firestore rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firebase Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14

      - name: Validate Firebase Functions syntax
        run: node --check functions/index.js && node --check functions/src/validation.js

      - name: Run Kotlin, Robolectric, Firestore rules, and Functions validation tests
        run: firebase emulators:exec --project demo-no-project --only auth,firestore "gradle --no-daemon lintDebug testDebugUnitTest && npm run test:firestore-rules && npm run test:functions"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-agent-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate temporary debug signing keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare optional release signing
        id: release_signing
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyber-agent-upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/cyber-agent-upload.jks" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release build skipped: release signing secrets are not configured."
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Assemble signed release APK
        if: steps.release_signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: steps.release_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cyber-agent-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
