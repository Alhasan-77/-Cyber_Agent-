name: Android CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create local secrets file with safe empty defaults
        run: |
          printf '%s\n' 'OPENAI_API_KEY="\"\""' > .env

      - name: Set up Node.js for Firebase emulators
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14

      - name: Run unit and Robolectric tests with Auth and Firestore emulators
        run: firebase emulators:exec --project demo-no-project --only auth,firestore "gradle --no-daemon testDebugUnitTest"

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
